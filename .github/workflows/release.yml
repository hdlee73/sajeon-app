name: Android release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (example: v1.0.0). Leave empty to build only."
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build dictionary and human bilingual example data
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/build_learning_data.py
      - name: Test vocabulary lookup and compile app
        run: gradle :app:testDebugUnitTest
      - name: Restore fixed APK signing key
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure ANDROID_DEBUG_KEYSTORE_BASE64 with a permanent keystore (alias androiddebugkey, store/key password android). Refusing to generate a different signing key for each update."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey
          echo "SAJEON_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build APK
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        run: gradle :app:assembleDebug
      - name: Verify the APK is signed with the permanent key
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        run: |
          expected=$(keytool -list -keystore "$SAJEON_KEYSTORE" -storepass android -alias androiddebugkey | grep -o 'SHA-256): .*' | sed 's/SHA-256): //' | tr -d ':' | tr 'A-F' 'a-f')
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "expected=$expected"; echo "actual=$actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::APK is not signed with the permanent key; updates would fail to install."
            exit 1
          fi
      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: actions/upload-artifact@v4
        with:
          name: sajeonapp-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              RELEASE_VERSION="$GITHUB_REF_NAME"
            else
              APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
              RELEASE_VERSION="v$APP_VERSION"
            fi
          fi
          APK_NAME="sajeonapp-$RELEASE_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_VERSION" "$APK_NAME" --title "영어단어장 $RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
