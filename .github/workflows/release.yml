name: Android release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (example: v1.0.0). Leave empty to build only."
        required: false
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download licensed English-Korean dictionary data
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/jhseo1211/open-english-korean-dict/92cbfe63deee1ccead2c42677027d8b4a305b2c7/dict/word_dictionary.sqlite \
            --output app/src/main/assets/word_dictionary.sqlite
      - name: Build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sajeonapp-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != '' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              RELEASE_VERSION="$GITHUB_REF_NAME"
            else
              APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
              RELEASE_VERSION="v$APP_VERSION"
            fi
          fi
          APK_NAME="sajeonapp-$RELEASE_VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_VERSION" "$APK_NAME" --title "영어단어장 $RELEASE_VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
